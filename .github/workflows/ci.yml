# Checks the types, runs the tests and builds the extension on every push to
# main and on every pull request. test/contrast.test.ts is skipped here, since
# it reads the themes from a VS Code install on macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
